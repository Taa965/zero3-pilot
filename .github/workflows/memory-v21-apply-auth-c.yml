name: Memory V2.1 Apply Auth C

on:
  push:
    branches: ['memory-v21/lane-c-server-sync']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v21/lane-c-server-sync
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: node scripts/patch-memory-v21-server-auth.mjs
      - run: cargo fmt --manifest-path apps/memory-server/Cargo.toml
      - name: Commit auth integration and remove bootstrap assets
        run: |
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git rm scripts/patch-memory-v21-server-auth.mjs .github/workflows/memory-v21-apply-auth-c.yml
          git add apps/memory-server/src
          git commit -m 'feat(memory-v21): enforce bearer ACL on memory server'
          git push origin HEAD:memory-v21/lane-c-server-sync
