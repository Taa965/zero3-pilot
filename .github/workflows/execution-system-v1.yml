name: Cross-App Execution System V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/zero3-desktop/execution-runtime/**'
      - 'apps/zero3-desktop/worker-runtime/**'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/scripts/apply-agent-lifecycle-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-artifact-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-shared-memory.mjs'
      - 'apps/zero3-desktop/mcp-runtime/worker-tools.mjs'
      - 'apps/zero3-desktop/mcp-runtime/project-context-http.mjs'
      - 'apps/zero3-desktop/mcp-runtime/project-context-http-policy.mjs'
      - 'apps/zero3-desktop/scripts/apply-project-context-http.mjs'
      - 'apps/zero3-desktop/scripts/apply-execution-runtime-bridge.mjs'
      - 'apps/zero3-desktop/scripts/prepare-codex-upstream.mjs'
      - 'apps/zero3-desktop/scripts/run.mjs'
      - 'apps/zero3-desktop/scripts/prepare-windows-package.mjs'
      - 'apps/zero3-desktop/tests/execution-reporter-bridge.test.cjs'
      - 'apps/zero3-desktop/group-runtime/store/atomic-file.ts'
      - 'docs/EXECUTION_SYSTEM_V1.md'
      - 'docs/EXECUTION_REPORTER_V1.md'
      - 'docs/WEB_GPT_WORKER_PROTOCOL_V1.md'
      - 'docs/WEB_GPT_WORKER_PROTOCOL_V2.md'
      - 'scripts/check-worker-protocol-v2-p1.mjs'
      - 'scripts/check-worker-protocol-v2-p2-p3.mjs'
      - 'scripts/check-agent-shared-state-mvp.mjs'
      - 'docs/AGENT_SHARED_ORGANIZATIONAL_STATE_MVP.md'
      - 'skills/zero3-web-worker/**'
      - 'skills/README.md'
      - '.github/workflows/execution-system-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/zero3-desktop/execution-runtime/**'
      - 'apps/zero3-desktop/worker-runtime/**'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/scripts/apply-agent-lifecycle-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-artifact-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-shared-memory.mjs'
      - 'apps/zero3-desktop/mcp-runtime/worker-tools.mjs'
      - 'apps/zero3-desktop/mcp-runtime/project-context-http.mjs'
      - 'apps/zero3-desktop/mcp-runtime/project-context-http-policy.mjs'
      - 'apps/zero3-desktop/scripts/apply-project-context-http.mjs'
      - 'apps/zero3-desktop/scripts/apply-execution-runtime-bridge.mjs'
      - 'apps/zero3-desktop/scripts/prepare-codex-upstream.mjs'
      - 'apps/zero3-desktop/scripts/run.mjs'
      - 'apps/zero3-desktop/scripts/prepare-windows-package.mjs'
      - 'apps/zero3-desktop/tests/execution-reporter-bridge.test.cjs'
      - 'apps/zero3-desktop/group-runtime/store/atomic-file.ts'
      - 'docs/EXECUTION_SYSTEM_V1.md'
      - 'docs/EXECUTION_REPORTER_V1.md'
      - 'docs/WEB_GPT_WORKER_PROTOCOL_V1.md'
      - 'docs/WEB_GPT_WORKER_PROTOCOL_V2.md'
      - 'scripts/check-worker-protocol-v2-p1.mjs'
      - 'scripts/check-worker-protocol-v2-p2-p3.mjs'
      - 'scripts/check-agent-shared-state-mvp.mjs'
      - 'docs/AGENT_SHARED_ORGANIZATIONAL_STATE_MVP.md'
      - 'skills/zero3-web-worker/**'
      - 'skills/README.md'
      - '.github/workflows/execution-system-v1.yml'
  workflow_dispatch: {}

jobs:
  execution-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Diff hygiene
        shell: bash
        run: git diff --check HEAD^...HEAD
      - name: Repository architecture guard
        run: node scripts/check-architecture.mjs
      - name: Execution core and reporter behavior tests
        run: node --experimental-transform-types --test apps/zero3-desktop/execution-runtime/execution-runtime.test.ts apps/zero3-desktop/execution-runtime/execution-reporter.test.ts apps/zero3-desktop/execution-runtime/execution-desktop-runtime.test.ts
      - name: Execution desktop bridge tests
        run: node --test apps/zero3-desktop/tests/execution-reporter-bridge.test.cjs
      - name: Reporter client syntax
        run: node --check apps/zero3-desktop/execution-runtime/zero3-exec.mjs
      - name: Web GPT worker protocol tests
        run: node --test apps/zero3-desktop/worker-runtime/worker-protocol.test.mjs
      - name: Worker Protocol v2 P1 guard
        run: node scripts/check-worker-protocol-v2-p1.mjs
      - name: Worker Protocol v2 P1 contracts
        run: node --experimental-transform-types --test apps/zero3-desktop/worker-runtime/v2/p1-contracts.test.ts
      - name: Worker Protocol v2 P2/P3 guard
        run: node scripts/check-worker-protocol-v2-p2-p3.mjs
      - name: Worker Protocol v2 long-lived runtime
        run: node --experimental-transform-types --test apps/zero3-desktop/worker-runtime/v2/workflow-worker-runtime.test.ts
      - name: Shared organizational state architecture guard
        run: node scripts/check-agent-shared-state-mvp.mjs
      - name: Shared organizational state lifecycle tests
        run: node --experimental-transform-types --test apps/zero3-desktop/worker-runtime/v2/lifecycle-runtime.test.ts
      - name: Web MCP access policy tests
        run: node --test apps/zero3-desktop/mcp-runtime/project-context-http-policy.test.mjs
