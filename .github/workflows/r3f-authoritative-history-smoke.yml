name: R3F Authoritative History Smoke

on:
  pull_request:
    branches: [main]

jobs:
  r3f-authoritative-history:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned desktop upstreams
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git submodule update --init --depth 1 -- upstream/codex upstream/hermes-agent upstream/deepseek-harness
          if ($LASTEXITCODE -ne 0) { throw 'submodule initialization failed' }

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Source architecture and syntax guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'base architecture guard failed' }
          node scripts/check-r3d-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3D architecture guard failed' }
          node scripts/check-r3e-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3E architecture guard failed' }
          node scripts/check-r3f-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3F architecture guard failed' }
          node --check apps/zero3-desktop/scripts/apply-codex-authoritative-history.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3F overlay syntax failed' }
          node --check apps/zero3-desktop/scripts/apply-codex-thread-actions-hardening.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3F overlay chain syntax failed' }

      - name: Verify pinned Codex paginated history contract
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $common = Get-Content -Raw 'upstream/codex/codex-rs/app-server-protocol/src/protocol/common.rs'
          $thread = Get-Content -Raw 'upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread.rs'
          $threadData = Get-Content -Raw 'upstream/codex/codex-rs/app-server-protocol/src/protocol/v2/thread_data.rs'
          $processor = Get-Content -Raw 'upstream/codex/codex-rs/app-server/src/request_processors/thread_processor.rs'

          if ($common -notmatch 'ThreadTurnsList => "thread/turns/list"') { throw 'Pinned Codex thread/turns/list registration changed' }
          if ($thread -notmatch 'pub struct ThreadTurnsListParams') { throw 'Pinned Codex ThreadTurnsListParams missing' }
          if ($thread -notmatch 'pub items_view: Option<TurnItemsView>') { throw 'Pinned Codex turns-list itemsView contract changed' }
          if ($thread -notmatch 'pub struct ThreadTurnsListResponse') { throw 'Pinned Codex ThreadTurnsListResponse missing' }
          if ($thread -notmatch 'pub data: Vec<Turn>') { throw 'Pinned Codex turns-list no longer returns Turn data' }
          if ($threadData -notmatch 'pub enum TurnItemsView') { throw 'Pinned Codex TurnItemsView missing' }
          if ($threadData -notmatch 'Full,') { throw 'Pinned Codex full TurnItemsView missing' }
          if ($threadData -notmatch 'pub items: Vec<ThreadItem>') { throw 'Pinned Codex Turn no longer owns ThreadItems' }
          if ($processor -notmatch 'Full-history hydration is deprecated for paginated threads') { throw 'Pinned Codex pagination guidance changed' }

      - name: Prepare pinned R3F desktop shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node apps/zero3-desktop/scripts/prepare-upstream.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3F desktop preparation failed' }

      - name: Verify generated authoritative history boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/public/zero3-upstream.json' | ConvertFrom-Json
          if ($stamp.coreRuntime -ne 'openai-codex-app-server') { throw 'Codex app-server must remain the core runtime' }
          if ($stamp.turnMappingPhase -ne 'R3E-codex-message-turn-mapping') { throw 'R3E provenance disappeared' }
          if ($stamp.historyPhase -ne 'R3F-codex-authoritative-history') { throw 'R3F provenance is missing' }
          if ($stamp.upstream.codex -ne '94311d447587411789533c47601fd8bc9d81eb48') { throw 'Pinned Codex provenance changed' }

          $main = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/electron/main.ts'
          $preload = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/electron/preload.ts'
          $globalTypes = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/global.d.ts'
          $primary = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/app/zero3-codex/primary-chat.ts'
          $wiring = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/app/contrib/wiring.tsx'

          if ($main -notmatch 'zero3:codex:thread:turns-list') { throw 'R3F typed turns-list IPC missing' }
          if ($main -notmatch "request\('thread/turns/list'") { throw 'R3F IPC does not call native thread/turns/list' }
          if ($main -notmatch "limit: 100") { throw 'R3F page-size policy missing' }
          if ($main -notmatch "sortDirection: 'asc'") { throw 'R3F ascending history policy missing' }
          if ($main -notmatch "itemsView: 'full'") { throw 'R3F full item history policy missing' }
          if ($preload -notmatch 'turnsList: request') { throw 'R3F typed preload method missing' }
          if ($globalTypes -notmatch 'type Zero3CodexThreadTurnsListRequest = \{ cursor\?: string; threadId: string \}') { throw 'R3F narrow turns-list request type missing' }
          if ($preload -match 'zero3:codex:(rpc|request|proxy)') { throw 'Renderer must not receive a generic Codex JSON-RPC proxy' }

          $boundaryReader = [regex]::Match(
            $primary,
            '(?s)const readThreadForBoundary = useCallback\(.*?const resolveMessageBoundary = useCallback'
          ).Value
          if (-not $boundaryReader) { throw 'Could not isolate R3F authoritative boundary history reader' }
          if ($boundaryReader -notmatch 'thread\.read\(\{ threadId, includeTurns: false \}\)') { throw 'R3F boundary metadata read must exclude embedded Turns' }
          if ($boundaryReader -notmatch 'window\.zero3Codex\.thread\.turnsList') { throw 'R3F boundary history does not use native turns pagination' }
          if ($boundaryReader -match 'includeTurns: true') { throw 'R3F destructive-history boundary still depends on whole-thread Turn hydration' }
          if ($primary -notmatch "turn\.itemsView !== 'full'") { throw 'R3F does not fail closed on incomplete Turn items' }
          if ($primary -notmatch 'turnIds\.has\(turn\.id\)') { throw 'R3F duplicate Turn guard missing' }
          if ($primary -notmatch 'cursors\.has\(page\.nextCursor\)') { throw 'R3F cursor-loop guard missing' }
          if ($primary -notmatch 'const editMessage = useCallback') { throw 'R3F Codex-native edit action missing' }
          if ($primary -notmatch 'edited\.sourceId') { throw 'R3F edit does not use message identity supplied by the UI' }
          if ($primary -notmatch 'boundary\.hasImageInput') { throw 'R3F destructive image-edit fail-closed gate missing' }
          if ($primary -notmatch 'revertBeforeTurn\(\{ threadId, beforeTurnId: boundary\.turnId \}\)') { throw 'R3F edit does not mutate by authoritative Turn id' }
          if ($wiring -notmatch 'codexPrimaryChat\.editMessage\(edited\)') { throw 'Hermes historical edit still bypasses the Codex adapter' }
