name: H5 Format Assist

on:
  push:
    branches: [feat/remote-control-plane-h5]

permissions:
  contents: write

jobs:
  rustfmt:
    if: github.event.head_commit.message != 'chore: rustfmt H5 control plane'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/remote-control-plane-h5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit formatted H5 sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git add apps/web/src/control_admission.rs apps/web/src/control_plane.rs apps/web/src/main.rs
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'chore: rustfmt H5 control plane'
          git push origin HEAD:feat/remote-control-plane-h5
