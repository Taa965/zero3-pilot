name: Memory V2.1 Lane B

on:
  pull_request:
    branches: [main]
    paths:
      - 'deployment/memory/**'
      - 'apps/zero3-desktop/memory-v21-runtime/authority-core*'
      - '.github/workflows/memory-v21-lane-b.yml'

jobs:
  authority-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node --test apps/zero3-desktop/memory-v21-runtime/authority-core.test.mjs
      - name: SQL invariants
        run: |
          grep -q 'CREATE EXTENSION IF NOT EXISTS vector' deployment/memory/migrations/001_memory_authority_v2_1.sql
          grep -q 'memory_events_append_only' deployment/memory/migrations/001_memory_authority_v2_1.sql
          grep -q 'event_id UUID NOT NULL UNIQUE' deployment/memory/migrations/001_memory_authority_v2_1.sql
