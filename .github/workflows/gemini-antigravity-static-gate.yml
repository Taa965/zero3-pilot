name: Gemini Antigravity Static Gate

on:
  push:
    branches:
      - 'feature/gpt-web-gemini-antigravity-v1'
      - 'feat/zero3-real-three-column-ui'
    paths:
      - 'apps/zero3-desktop/renderer-v2/**'
      - 'apps/zero3-desktop/gemini-web-runtime/**'
      - 'apps/zero3-desktop/antigravity-runtime/**'
      - 'apps/zero3-desktop/agent-routing-runtime/**'
      - 'apps/zero3-desktop/agent-desktop-bridge/**'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/mcp-runtime/**'
      - 'apps/zero3-desktop/gpt-web-ui/**'
      - 'apps/zero3-desktop/host-runtime/**'
      - 'apps/zero3-desktop/scripts/**'
      - 'apps/zero3-desktop/package.json'
      - 'scripts/check-gemini-antigravity-architecture.mjs'
      - 'scripts/check-prepared-gemini-integration.mjs'
      - 'scripts/acceptance/gemini-antigravity-windows.ps1'
      - '.github/workflows/windows-alpha-artifact.yml'
      - '.github/workflows/gemini-antigravity-static-gate.yml'
  pull_request:
    paths:
      - 'apps/zero3-desktop/renderer-v2/**'
      - 'apps/zero3-desktop/gemini-web-runtime/**'
      - 'apps/zero3-desktop/antigravity-runtime/**'
      - 'apps/zero3-desktop/agent-routing-runtime/**'
      - 'apps/zero3-desktop/agent-desktop-bridge/**'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/mcp-runtime/**'
      - 'apps/zero3-desktop/gpt-web-ui/**'
      - 'apps/zero3-desktop/host-runtime/**'
      - 'apps/zero3-desktop/scripts/**'
      - 'apps/zero3-desktop/package.json'
      - 'scripts/check-gemini-antigravity-architecture.mjs'
      - 'scripts/check-prepared-gemini-integration.mjs'
      - 'scripts/acceptance/gemini-antigravity-windows.ps1'
      - '.github/workflows/windows-alpha-artifact.yml'
      - '.github/workflows/gemini-antigravity-static-gate.yml'
  workflow_dispatch:

concurrency:
  group: gemini-antigravity-static-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Check source architecture invariants
        run: node scripts/check-gemini-antigravity-architecture.mjs

      - name: Apply all pinned desktop runtime overlays and inspect the authoritative renderer
        shell: bash
        run: |
          set -euo pipefail
          cleanup() {
            npm --prefix apps/zero3-desktop run reset >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          npm --prefix apps/zero3-desktop run prepare
          node scripts/check-prepared-gemini-integration.mjs

      - name: Reject whitespace errors in committed closeout diff
        run: git diff --check
