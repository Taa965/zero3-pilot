name: Memory V2.1 Lane A

on:
  pull_request:
    branches: [main]
    paths:
      - 'schemas/zero3.memory.*'
      - 'scripts/check-memory-v21-protocol.mjs'
      - '.github/workflows/memory-v21-lane-a.yml'

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node scripts/check-memory-v21-protocol.mjs
