name: R3D Thread Actions Smoke

on:
  pull_request:
    branches: [main]

jobs:
  r3d-thread-actions:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Initialize pinned desktop upstreams
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git submodule update --init --depth 1 -- upstream/codex upstream/hermes-agent upstream/deepseek-harness
          if ($LASTEXITCODE -ne 0) { throw 'submodule initialization failed' }

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: Source architecture and syntax guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node scripts/check-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'base architecture guard failed' }
          node scripts/check-r3d-architecture.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3D architecture guard failed' }
          node --check apps/zero3-desktop/scripts/apply-codex-thread-actions.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3D thread-action overlay syntax failed' }
          node --check apps/zero3-desktop/scripts/apply-codex-thread-actions-hardening.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3D thread-action hardening syntax failed' }
          node --check apps/zero3-desktop/scripts/apply-codex-structured-input-hardening.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3C/R3D chain syntax failed' }

      - name: Prepare pinned R3D desktop shell
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node apps/zero3-desktop/scripts/prepare-upstream.mjs
          if ($LASTEXITCODE -ne 0) { throw 'R3D desktop preparation failed' }

      - name: Verify generated native thread-action boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/public/zero3-upstream.json' | ConvertFrom-Json
          if ($stamp.coreRuntime -ne 'openai-codex-app-server') { throw 'Codex app-server must remain the core runtime' }
          if ($stamp.threadActionsPhase -ne 'R3D-codex-thread-actions') { throw 'R3D thread-action provenance is missing' }
          if ($stamp.upstream.codex -ne '94311d447587411789533c47601fd8bc9d81eb48') { throw 'Pinned Codex provenance changed' }
          if ($stamp.upstream.hermes -ne 'f7c79efbac19ae18e8dee7c79a4e4c0935299b5f') { throw 'Pinned Hermes provenance changed' }

          $main = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/electron/main.ts'
          $preload = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/electron/preload.ts'
          $globalTypes = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/global.d.ts'
          $primary = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/app/zero3-codex/primary-chat.ts'
          $settings = Get-Content -Raw 'upstream/hermes-agent/apps/desktop/src/app/settings/sessions-settings.tsx'

          @(
            'zero3:codex:thread:archive',
            'zero3:codex:thread:unarchive',
            'zero3:codex:thread:delete',
            'zero3:codex:thread:name:set',
            'zero3:codex:thread:fork',
            'zero3:codex:turn:steer'
          ) | ForEach-Object {
            if ($main -notmatch [regex]::Escape($_)) { throw "R3D typed IPC missing: $_" }
            if ($preload -notmatch [regex]::Escape($_)) { throw "R3D preload method missing: $_" }
          }

          $forkParser = [regex]::Match(
            $main,
            '(?s)function zero3CodexThreadForkParams\(value: unknown\).*?function zero3CodexThreadSetNameParams'
          ).Value
          if (-not $forkParser) { throw 'Could not isolate generated R3D fork validator' }
          if ($forkParser -notmatch "approvalPolicy: 'on-request'") { throw 'R3D fork must force on-request approvals' }
          if ($forkParser -notmatch "sandbox: 'read-only'") { throw 'R3D fork must force read-only sandbox' }
          if ($forkParser -match 'lastTurnId') { throw 'Renderer-controlled lastTurnId leaked into whole-thread R3D fork' }

          $forkType = [regex]::Match($globalTypes, 'type Zero3CodexThreadForkRequest = .*').Value
          if ($forkType -ne 'type Zero3CodexThreadForkRequest = { threadId: string }') { throw 'R3D renderer fork type must be whole-thread only' }
          if ($globalTypes -notmatch 'setName: \(request: Zero3CodexThreadSetNameRequest\)') { throw 'Typed Codex rename surface missing' }
          if ($globalTypes -notmatch 'steer: \(request: Zero3CodexTurnSteerRequest\)') { throw 'Typed Codex steer surface missing' }

          if ($primary -notmatch 'window\.zero3Codex\.thread\.archive') { throw 'Primary Codex archive action missing' }
          if ($primary -notmatch 'window\.zero3Codex\.thread\.delete') { throw 'Primary Codex delete action missing' }
          if ($primary -notmatch 'window\.zero3Codex\.thread\.fork') { throw 'Primary Codex whole-thread fork action missing' }
          if ($primary -notmatch 'window\.zero3Codex\.turn\.steer') { throw 'Primary Codex active-turn steer action missing' }
          if ($primary -match 'requestGateway\(|ZERO3_PILOT_NODE_PORT|zero3:chat:turn') { throw 'Legacy/Hermes runtime execution leaked into R3D primary actions' }

          if ($settings -notmatch 'window\.zero3Codex\.thread\.list\(\{ archived: true') { throw 'Archived settings do not read Codex Threads' }
          if ($settings -notmatch 'window\.zero3Codex\.thread\.unarchive') { throw 'Archived settings do not unarchive through Codex' }
          if ($settings -notmatch 'window\.zero3Codex\.thread\.delete') { throw 'Archived settings do not delete through Codex' }
          if ($settings -notmatch '!window\.zero3Codex && <AutoArchiveSetting />') { throw 'Hermes auto-archive policy must be hidden in Codex mode' }
          if ($settings -notmatch 'thread\.parentThreadId == null') { throw 'Archived internal child-thread filter missing' }
          if ($settings -notmatch 'thread\.ephemeral !== true') { throw 'Archived ephemeral-thread filter missing' }

          if ($main -match 'zero3:codex:thread:(revert|rollback)') { throw 'Message-level revert/rollback was exposed before Turn-id mapping' }
          if ($preload -match 'zero3:codex:(rpc|request|proxy)') { throw 'Renderer must not receive a generic Codex JSON-RPC proxy' }
