name: Deploy

# Strict release gate: test -> build -> deploy, as three jobs in ONE
# workflow run so they always share the same $GITHUB_SHA and can never
# race against each other. A push to main that fails fmt/clippy/build/test
# never reaches `build` or `deploy` — GitHub Actions skips downstream jobs
# automatically when a `needs:` dependency fails.
#
# Isolated deploy path for the zero3-pilot control server only.
# - Builds on a GitHub-hosted runner (never the existing self-hosted
#   runner on the target host, which belongs to a different repo/project).
# - Deploys as the dedicated `zero3pilot` Linux account via a key that
#   can only SSH in as that account, which in turn can only sudo one
#   fixed script (`zero3pilot-deploy-release`: daemon-reload + restart
#   zero3-pilot.service, nothing else). It never has access to the
#   unrelated Zero3 self-media system's credentials, database, or sudo
#   entries. See docs/DEPLOYMENT.md.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # upstream/codex is large; not needed to build zero3-* crates

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release -p zero3-web
      - uses: actions/upload-artifact@v4
        with:
          name: zero3-web-${{ github.sha }}
          path: target/release/zero3-web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zero3-web-${{ github.sha }}
          path: dist

      - name: Pin known SSH host key
        run: |
          mkdir -p ~/.ssh
          cp deployment/ssh_known_hosts ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Configure deploy key
        run: |
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/zero3pilot_deploy
          chmod 600 ~/.ssh/zero3pilot_deploy

      - name: Upload release binary + deploy script
        run: |
          chmod +x dist/zero3-web
          ssh -i ~/.ssh/zero3pilot_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p /tmp/zero3-pilot-deploy-${{ github.sha }}"
          scp -i ~/.ssh/zero3pilot_deploy -P "${{ secrets.DEPLOY_PORT }}" \
            dist/zero3-web deployment/deploy.sh \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/zero3-pilot-deploy-${{ github.sha }}/"

      - name: Run atomic deploy on target host
        env:
          REMOTE_CMD: >-
            DEPLOY_PATH='${{ secrets.DEPLOY_PATH }}'
            GIT_SHA='${{ github.sha }}'
            BUILD_ARTIFACT=/tmp/zero3-pilot-deploy-${{ github.sha }}/zero3-web
            bash /tmp/zero3-pilot-deploy-${{ github.sha }}/deploy.sh
        run: |
          ssh -i ~/.ssh/zero3pilot_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "$REMOTE_CMD"

      - name: Clean up staging dir
        if: always()
        run: |
          ssh -i ~/.ssh/zero3pilot_deploy -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "rm -rf /tmp/zero3-pilot-deploy-${{ github.sha }}" || true

      - name: External health check (must match exact deployed SHA)
        run: |
          set -e
          expected_sha="$(git rev-parse --short HEAD)"
          echo "expected git_sha=$expected_sha"
          for i in $(seq 1 10); do
            body="$(ssh -i ~/.ssh/zero3pilot_deploy -p "${{ secrets.DEPLOY_PORT }}" \
              "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
              "curl -s http://127.0.0.1:8788/health" || true)"
            actual_sha="$(printf '%s' "$body" | jq -r '.git_sha // empty' 2>/dev/null || true)"
            status="$(printf '%s' "$body" | jq -r '.status // empty' 2>/dev/null || true)"
            if [ "$status" = "ok" ] && [ "$actual_sha" = "$expected_sha" ]; then
              echo "health check passed: git_sha=$actual_sha matches expected"
              exit 0
            fi
            echo "attempt $i: status=$status actual_sha=$actual_sha (waiting for $expected_sha)"
            sleep 2
          done
          echo "health check failed: deployed git_sha never matched expected $expected_sha"
          exit 1
