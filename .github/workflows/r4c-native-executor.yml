name: R4C Native Codex Executor

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/zero3-desktop/executor-runtime/native/**'
      - 'apps/zero3-desktop/scripts/apply-codex-transport.mjs'
      - 'scripts/check-r4c-native-executor-architecture.mjs'
      - '.github/workflows/r4c-native-executor.yml'

jobs:
  native-codex:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '24.11.0' }
      - name: Diff hygiene
        run: git diff --check origin/main...HEAD
      - name: Architecture guards
        run: |
          node scripts/check-architecture.mjs
          node scripts/check-r4c-native-executor-architecture.mjs
          node --check apps/zero3-desktop/scripts/apply-codex-transport.mjs
      - name: Install exact TypeScript typecheck tools
        run: npm install --no-save --package-lock=false --ignore-scripts typescript@5.9.2 @types/node@24.10.1
      - name: Strict TypeScript check
        run: >-
          npx --no-install tsc --noEmit --strict --target ES2022 --module NodeNext --moduleResolution NodeNext --allowImportingTsExtensions --skipLibCheck
          apps/zero3-desktop/executor-runtime/native/native-driver.ts
          apps/zero3-desktop/executor-runtime/native/native-home.ts
          apps/zero3-desktop/executor-runtime/native/native-codex-executor.ts
          apps/zero3-desktop/executor-runtime/native/native-app-server-driver.ts
          apps/zero3-desktop/executor-runtime/native/native-codex-executor.test.ts
      - name: Native executor behavior tests
        run: node --experimental-transform-types --test apps/zero3-desktop/executor-runtime/native/native-codex-executor.test.ts
