name: Web GPT Worker Gateway V1

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/worker_gateway.rs'
      - 'apps/web/src/oauth.rs'
      - 'apps/web/src/main.rs'
      - 'apps/zero3-desktop/host-runtime/**'
      - 'apps/zero3-desktop/worker-runtime/v2/**'
      - 'apps/zero3-desktop/workflow-runtime/**'
      - 'apps/zero3-desktop/gpt-web-runtime/chatgpt-wakeup.ts'
      - 'apps/zero3-desktop/scripts/apply-agent-lifecycle-runtime.mjs'
      - 'apps/zero3-desktop/scripts/overlay-patch.mjs'
      - 'apps/zero3-desktop/tests/overlay-patch.test.mjs'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/scripts/apply-artifact-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-shared-memory.mjs'
      - 'apps/zero3-desktop/scripts/apply-remote-host-runtime.mjs'
      - 'scripts/check-web-gpt-worker-gateway-v1.mjs'
      - 'scripts/check-worker-protocol-v2-p2-p3.mjs'
      - 'scripts/check-worker-wakeup-p5.mjs'
      - 'docs/WEB_GPT_*'
      - 'docs/AGENT_SHARED_ORGANIZATIONAL_STATE_MVP.md'
      - 'scripts/check-agent-shared-state-mvp.mjs'
      - 'deployment/productization/self-host.env.example'
      - '.github/workflows/web-gpt-worker-gateway-v1.yml'
  push:
    branches: [main]
    paths:
      - 'apps/web/src/worker_gateway.rs'
      - 'apps/web/src/oauth.rs'
      - 'apps/web/src/main.rs'
      - 'apps/zero3-desktop/host-runtime/**'
      - 'apps/zero3-desktop/worker-runtime/v2/**'
      - 'apps/zero3-desktop/scripts/apply-agent-lifecycle-runtime.mjs'
      - 'apps/zero3-desktop/scripts/overlay-patch.mjs'
      - 'apps/zero3-desktop/tests/overlay-patch.test.mjs'
      - 'apps/zero3-desktop/artifact-runtime/**'
      - 'apps/zero3-desktop/scripts/apply-artifact-runtime.mjs'
      - 'apps/zero3-desktop/scripts/apply-shared-memory.mjs'
      - 'apps/zero3-desktop/scripts/apply-remote-host-runtime.mjs'
      - 'scripts/check-web-gpt-worker-gateway-v1.mjs'
      - 'scripts/check-worker-protocol-v2-p2-p3.mjs'
      - 'scripts/check-worker-wakeup-p5.mjs'
      - 'docs/WEB_GPT_*'
      - 'docs/AGENT_SHARED_ORGANIZATIONAL_STATE_MVP.md'
      - 'scripts/check-agent-shared-state-mvp.mjs'
      - 'deployment/productization/self-host.env.example'
      - '.github/workflows/web-gpt-worker-gateway-v1.yml'
      - 'apps/zero3-desktop/workflow-runtime/**'
      - 'apps/zero3-desktop/gpt-web-runtime/chatgpt-wakeup.ts'

jobs:
  gateway-static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - name: Diff hygiene
        shell: bash
        run: git diff --check HEAD^...HEAD
      - name: Gateway architecture guard
        run: node scripts/check-web-gpt-worker-gateway-v1.mjs
      - name: Worker Tunnel overlay replay guard
        run: node --test apps/zero3-desktop/tests/overlay-patch.test.mjs
      - name: Worker Protocol v2 gateway guard
        run: node scripts/check-worker-protocol-v2-p2-p3.mjs
      - name: Worker Wakeup P5 guard
        run: node scripts/check-worker-wakeup-p5.mjs
      - name: Shared organizational state guard
        run: node scripts/check-agent-shared-state-mvp.mjs
      - name: Existing remote architecture guards
        run: |
          node scripts/check-remote-host-architecture.mjs
          node scripts/check-remote-control-plane-h5-architecture.mjs
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Zero3 web tests
        run: cargo test -p zero3-web
      - name: Worker tunnel tests
        run: node --experimental-transform-types --test apps/zero3-desktop/host-runtime/remote-worker-rpc.test.ts apps/zero3-desktop/host-runtime/remote-config.test.ts
      - name: Workflow Worker v2 runtime tests
        run: node --experimental-transform-types --test apps/zero3-desktop/worker-runtime/v2/workflow-worker-runtime.test.ts
      - name: Worker Wakeup P5 tests
        run: node --experimental-transform-types --test apps/zero3-desktop/workflow-runtime/worker-wakeup.test.ts apps/zero3-desktop/gpt-web-runtime/chatgpt-wakeup.test.ts
      - name: Worker Station Manager final guard
        run: node scripts/check-worker-station-manager-final.mjs
      - name: Worker Station Manager behavior
        run: node --experimental-transform-types --test apps/zero3-desktop/workflow-runtime/worker-station-manager.test.ts
