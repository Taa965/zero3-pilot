name: Memory V2.1 Autoformat C

on:
  push:
    branches: ['memory-v21/lane-c-server-sync']

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v21/lane-c-server-sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --manifest-path apps/memory-server/Cargo.toml
      - name: Commit rustfmt output when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git add apps/memory-server/src
          git commit -m 'style(memory-v21): rustfmt lane C'
          git push origin HEAD:memory-v21/lane-c-server-sync
