name: Memory V2.1 Autoformat C

on:
  push:
    branches: ['memory-v21/lane-c-server-sync']

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v21/lane-c-server-sync
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node scripts/patch-memory-v21-lane-c.mjs
      - run: cargo fmt --manifest-path apps/memory-server/Cargo.toml
      - run: cargo generate-lockfile --manifest-path apps/memory-server/Cargo.toml
      - name: Commit normalized source and remove bootstrap workflow
        run: |
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git rm scripts/patch-memory-v21-lane-c.mjs .github/workflows/memory-v21-autoformat-c.yml
          git add apps/memory-server/src apps/memory-server/Cargo.lock
          git commit -m 'style(memory-v21): finalize lane C source and lockfile'
          git push origin HEAD:memory-v21/lane-c-server-sync
