name: Memory V2.1 Lane C

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/memory-server/**'
      - '.github/workflows/memory-v21-lane-c.yml'

jobs:
  server-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/memory-server
      - name: Normalize Rust formatting before compile gates
        run: cargo fmt --manifest-path apps/memory-server/Cargo.toml
      - run: cargo clippy --manifest-path apps/memory-server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/memory-server/Cargo.toml
