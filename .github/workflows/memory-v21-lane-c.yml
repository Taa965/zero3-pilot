name: Memory V2.1 Lane C

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/memory-server/**'
      - '.github/workflows/memory-v21-lane-c.yml'

# Strict compile gate: no autoformat or generated commit is allowed here.
jobs:
  server-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/memory-server
      - run: cargo fmt --manifest-path apps/memory-server/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path apps/memory-server/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path apps/memory-server/Cargo.toml
