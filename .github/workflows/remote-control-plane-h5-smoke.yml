name: Remote Control Plane H5 Smoke

on:
  pull_request:
    branches: [main]

jobs:
  control-plane-h5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'

      - name: H5 architecture guard
        run: node scripts/check-remote-control-plane-h5-architecture.mjs

      - name: Test zero3-web control plane
        run: cargo test -p zero3-web

      - name: Build zero3-web
        run: cargo build -p zero3-web

      - name: Real HTTP lease fencing and restart smoke
        shell: bash
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          trap 'if [[ -n "${server_pid:-}" ]]; then kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true; fi; rm -rf "$root"' EXIT

          printf '%s\n' 'host-smoke-secret' > "$root/host.token"
          printf '%s\n' 'control-smoke-secret' > "$root/control.token"
          chmod 600 "$root/host.token" "$root/control.token"

          export ZERO3_WEB_PORT=18788
          export ZERO3_HOST_TOKEN_FILE="$root/host.token"
          export ZERO3_CONTROL_TOKEN_FILE="$root/control.token"
          export ZERO3_CONTROL_PLANE_DATA_DIR="$root/state"

          start_server() {
            ./target/debug/zero3-web >"$root/server.log" 2>&1 &
            server_pid=$!
            for _ in $(seq 1 40); do
              if curl --fail --silent http://127.0.0.1:18788/health >/dev/null; then
                return 0
              fi
              sleep 0.25
            done
            cat "$root/server.log"
            return 1
          }

          stop_server() {
            kill "$server_pid"
            wait "$server_pid" || true
            server_pid=''
          }

          start_server

          # Control-plane admission must reject a task that the Windows Host
          # would reject later, before that payload can become durable state.
          invalid_status="$(curl --silent --show-error -o "$root/invalid.json" -w '%{http_code}' \
            -H 'authorization: Bearer control-smoke-secret' \
            -H 'content-type: application/json' \
            -d '{"protocol":"zero3.pilot.remote-task.v1","task_id":"invalid-task","execution_id":"invalid-exec","objective":"must be rejected before persistence","target":{"workspace":"/tmp/zero3-workspace"},"permission_profile":"god_mode"}' \
            http://127.0.0.1:18788/api/control/v1/tasks)"
          test "$invalid_status" = '400'
          test ! -e "$root/state/tasks/invalid-task.json"

          curl --fail --silent --show-error \
            -H 'authorization: Bearer control-smoke-secret' \
            -H 'content-type: application/json' \
            -d '{"protocol":"zero3.pilot.remote-task.v1","task_id":"smoke-task","execution_id":"smoke-exec","objective":"real HTTP smoke","target":{"workspace":"/tmp/zero3-workspace"},"permission_profile":"read_only"}' \
            http://127.0.0.1:18788/api/control/v1/tasks > "$root/task.json"

          curl --fail --silent --show-error \
            -H 'authorization: Bearer host-smoke-secret' \
            -H 'x-zero3-node-id: smoke-node' \
            -H 'content-type: application/json' \
            -d '{"node_id":"smoke-node","capabilities":["codex","thread","turn","git"]}' \
            http://127.0.0.1:18788/api/host/v1/nodes/register > "$root/node.json"

          curl --fail --silent --show-error \
            -H 'authorization: Bearer host-smoke-secret' \
            -H 'x-zero3-node-id: smoke-node' \
            -H 'content-type: application/json' \
            -d '{"node_id":"smoke-node","wait_seconds":1,"capabilities":["codex","thread","turn","git"]}' \
            http://127.0.0.1:18788/api/host/v1/tasks/lease > "$root/lease.json"

          lease_id="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["lease_id"])' "$root/lease.json")"
          fence="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["fencing_token"])' "$root/lease.json")"

          curl --fail --silent --show-error \
            -H 'authorization: Bearer host-smoke-secret' \
            -H 'x-zero3-node-id: smoke-node' \
            -H 'content-type: application/json' \
            -d "{\"delivery_id\":\"delivery-smoke-1\",\"execution_id\":\"smoke-exec\",\"lease_id\":\"$lease_id\",\"fencing_token\":$fence,\"event_sequence\":1,\"event_type\":\"host.accepted\",\"created_at\":\"2026-08-30T00:00:00Z\",\"payload\":{\"node_id\":\"smoke-node\"}}" \
            http://127.0.0.1:18788/api/host/v1/tasks/smoke-task/events > "$root/event.json"

          # Exact delivery replay is idempotent.
          curl --fail --silent --show-error \
            -H 'authorization: Bearer host-smoke-secret' \
            -H 'x-zero3-node-id: smoke-node' \
            -H 'content-type: application/json' \
            -d "{\"delivery_id\":\"delivery-smoke-1\",\"execution_id\":\"smoke-exec\",\"lease_id\":\"$lease_id\",\"fencing_token\":$fence,\"event_sequence\":1,\"event_type\":\"host.accepted\",\"created_at\":\"2026-08-30T00:00:00Z\",\"payload\":{\"node_id\":\"smoke-node\"}}" \
            http://127.0.0.1:18788/api/host/v1/tasks/smoke-task/events >/dev/null

          curl --fail --silent --show-error \
            -H 'authorization: Bearer host-smoke-secret' \
            -H 'x-zero3-node-id: smoke-node' \
            -H 'content-type: application/json' \
            -d "{\"delivery_id\":\"delivery-smoke-terminal\",\"execution_id\":\"smoke-exec\",\"lease_id\":\"$lease_id\",\"fencing_token\":$fence,\"created_at\":\"2026-08-30T00:00:01Z\",\"state\":\"succeeded\",\"result\":{\"summary\":\"done\"}}" \
            http://127.0.0.1:18788/api/host/v1/tasks/smoke-task/complete > "$root/terminal.json"

          stop_server
          start_server

          curl --fail --silent --show-error \
            -H 'authorization: Bearer control-smoke-secret' \
            http://127.0.0.1:18788/api/control/v1/tasks/smoke-task > "$root/reloaded.json"

          python3 - "$root/reloaded.json" <<'PY'
          import json, sys
          record = json.load(open(sys.argv[1]))
          assert record['state'] == 'succeeded', record
          assert record['last_event_sequence'] == 1, record
          assert record['terminal']['result']['summary'] == 'done', record
          assert len(record['delivery_fingerprints']) == 2, record
          PY
