name: CI

# PR-only status check. Push-to-main gating lives entirely inside
# deploy.yml's own `test` job (sequential: test -> build -> deploy, one
# workflow run, one SHA) so this workflow can never race a broken push
# against a deploy — see docs/DEPLOYMENT.md.
on:
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false # upstream/codex is large; not needed to build zero3-* crates

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: build
        run: cargo build --workspace --all-targets

      - name: test
        run: cargo test --workspace
