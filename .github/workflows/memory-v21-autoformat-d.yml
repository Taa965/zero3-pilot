name: Memory V2.1 Autoformat D

on:
  push:
    branches: ['memory-v21/lane-d-local-offline']

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v21/lane-d-local-offline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit rustfmt output when needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git add crates/zero3-memory/src/sync_queue.rs crates/zero3-memory/tests/sync_queue.rs
          git commit -m 'style(memory-v21): rustfmt lane D'
          git push origin HEAD:memory-v21/lane-d-local-offline
