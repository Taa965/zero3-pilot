name: Memory V2.1 Autoformat D

on:
  push:
    branches: ['memory-v21/lane-d-local-offline']

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: memory-v21/lane-d-local-offline
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: '24.11.0'
      - run: node scripts/patch-memory-v21-lane-d.mjs
      - run: cargo fmt --all
      - name: Commit normalized source and remove bootstrap workflow
        run: |
          git config user.name 'zero3-ci'
          git config user.email 'zero3-ci@users.noreply.github.com'
          git rm scripts/patch-memory-v21-lane-d.mjs .github/workflows/memory-v21-autoformat-d.yml
          git add crates/zero3-memory/src/lib.rs crates/zero3-memory/src/sync_queue.rs crates/zero3-memory/tests/sync_queue.rs
          git commit -m 'style(memory-v21): finalize lane D source and module export'
          git push origin HEAD:memory-v21/lane-d-local-offline
