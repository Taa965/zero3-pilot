# Reverse proxy for Zero3 Pilot's control/web server.
# Independent site: does not edit, replace, or listen on the same
# server_name as any other site on this host (`zero3`, `zero3-03-336r-com`).
#
# Upstream 127.0.0.1:8788 is Zero3 Pilot's own port — confirmed free via
# `ss -lntp` before this file was installed; do not repurpose it.

server {
    listen 80;
    listen [::]:80;
    server_name pilot.03.336r.com;

    location /health {
        proxy_pass http://127.0.0.1:8788/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# `certbot --nginx -d pilot.03.336r.com` appends the HTTPS server block once
# DNS for this subdomain resolves to this host. Do not hand-write it ahead
# of that, and do not loop certbot while DNS is still missing — see
# docs/DEPLOYMENT.md.
