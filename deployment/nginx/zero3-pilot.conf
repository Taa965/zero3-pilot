# Reverse proxy for Zero3 Pilot's control/web server.
# Drop into the target host's site-enabled directory alongside existing
# sites — do not edit or remove any other server block.
#
# Port 8788 is Zero3 Pilot's own upstream; confirm it is free on the target
# host (`ss -lntp`) before first deploy, and never reuse a port already
# bound by another service.

server {
    listen 80;
    listen [::]:80;
    server_name pilot.YOUR-DOMAIN.example; # replace once a subdomain is chosen

    location / {
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# certbot --nginx will append the HTTPS server block once DNS for the
# chosen subdomain resolves to the target host. Do not hand-write it ahead
# of that — see docs/DEPLOYMENT.md.
