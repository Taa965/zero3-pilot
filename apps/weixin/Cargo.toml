[package]
name = "zero3-weixin"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Weixin ClawBot channel bridge for Zero3 Pilot."

[[bin]]
name = "zero3-pilot-weixin"
path = "src/main.rs"

[dependencies]
zero3-providers = { path = "../../crates/zero3-providers" }
