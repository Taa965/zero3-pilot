[package]
name = "zero3-providers"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Provider registry (Computer, Browser): registration, health checks, capability discovery/selection, plus an Open Computer Use adapter."

[dependencies]
zero3-core = { path = "../zero3-core" }
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true
anyhow.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["process", "io-util", "sync", "rt-multi-thread", "macros", "time"] }
